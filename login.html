<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Luhan Casino</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0b0f 0%, #15151c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Efecto de luces de fondo (ambiente de casino) */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(220, 20, 60, 0.15) 0%, rgba(11, 11, 15, 0) 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(220, 20, 60, 0.1) 0%, rgba(11, 11, 15, 0) 70%);
            bottom: -100px;
            right: -100px;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            background: rgba(21, 21, 28, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(220, 20, 60, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .login-header h1 span {
            color: #e50914; /* Rojo Luhan Casino */
            text-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
        }

        .login-header p {
            color: #9aa0a6;
            font-size: 0.9rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #9aa0a6;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(11, 11, 15, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #e50914;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.25);
            background: rgba(11, 11, 15, 0.9);
        }

        .input-group input:focus + i {
            color: #e50914;
        }

        .error-message {
            background: rgba(229, 9, 20, 0.15);
            border: 1px solid rgba(229, 9, 20, 0.4);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #9aa0a6;
            margin-bottom: 25px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .form-options input[type="checkbox"] {
            accent-color: #e50914;
            cursor: pointer;
        }

        .form-options a {
            color: #9aa0a6;
            text-decoration: none;
            transition: color 0.3s;
        }

        .form-options a:hover {
            color: #e50914;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #ff1e2b 0%, #cc0a14 100%);
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.6);
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: #9aa0a6;
        }

        .register-link a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .register-link a:hover {
            color: #e50914;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>LUHAN <span>CASINO</span></h1>
            <p>Ingresa a tu cuenta y siente la emoción</p>
        </div>

        <div id="errorAlert" class="error-message">
            Usuario o contraseña incorrectos.
        </div>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="usuarioInput" placeholder="Correo o Usuario" required>
                <i class="fa-solid fa-envelope"></i>
            </div>

            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Contraseña" required>
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox"> Recuérdame
                </label>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <div class="register-link">
            ¿No tienes cuenta aún? <a href="#">Regístrate aquí</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const usuarioIngresado = document.getElementById('usuarioInput').value.trim();
            const passwordIngresado = document.getElementById('passwordInput').value.trim();
            const errorAlert = document.getElementById('errorAlert');

            try {
                // Hacemos fetch al archivo luhanes.json
                const response = await fetch('luhanes.json');
                if (!response.ok) {
                    throw new Error('No se pudo cargar la base de datos de usuarios.');
                }
                
                const usuarios = await response.json();

                // Buscamos si coincide el usuario y la contraseña
                const usuarioEncontrado = usuarios.find(u => u.usuario === usuarioIngresado && u.contraseña === passwordIngresado);

                if (usuarioEncontrado) {
                    // Guardamos los datos en localStorage para usarlos en index.html en el futuro
                    localStorage.setItem('luhan_usuario', usuarioEncontrado.usuario);
                    localStorage.setItem('luhan_saldo', usuarioEncontrado.saldo);

                    // Redirigimos al index.html
                    window.location.href = 'index.html';
                } else {
                    // Mostramos alerta de error
                    errorAlert.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                errorAlert.textContent = 'Error al conectar con la base de datos (luhanes.json).';
                errorAlert.style.display = 'block';
            }
        });
    </script>

</body>
</html>
